version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - shopnet
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - shopnet

volumes:
  redis-data:

networks:
  shopnet:
    driver: bridge