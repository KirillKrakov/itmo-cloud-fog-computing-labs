version: "3.8"
services:
  frontend:
    image: shop_frontend:latest    # изображение, собранное ранее
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - shopnet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - shopnet
    deploy:
      replicas: 1
      restart_policy:
        condition: any

volumes:
  redis-data:

networks:
  shopnet:
    driver: overlay